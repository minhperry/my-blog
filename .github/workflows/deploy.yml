name: Deploy Astro Blog to VPS

on:
  push:
    branches:
      - astro

jobs:
  deps-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Clear build cache
        run: |
          rm -rf dist/
          rm -rf .astro/
          rm -rf node_modules/.cache/
          echo "Build cache cleared"

      - name: Build Astro app
        run: pnpm run build
        working-directory: ${{ github.workspace }}

      - name: Verify build output
        run: |
          echo "=== Build Output Verification ==="
          echo "Total HTML files: $(find dist -name "*.html" | wc -l)"
          echo "Index file exists: $(test -f dist/index.html && echo "YES" || echo "NO")"
          echo "Index file size: $(ls -lh dist/index.html 2>/dev/null || echo "NOT FOUND")"
          echo "Index file timestamp: $(stat -c %y dist/index.html 2>/dev/null || echo "NOT FOUND")"
          echo "Recent HTML files:"
          find dist -name "*.html" -mtime -1 | head -5
          echo "================================"

      - name: Add cache-busting headers
        run: |
          # Add cache-busting meta tags to HTML files
          find dist -name "*.html" -exec sed -i 's/<head>/<head>\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">/' {} \;
          echo "Cache-busting headers added to HTML files"

      - name: Clean remote directory
        run: |
          echo "${{ secrets.SSH_KEY }}" > ssh_key
          chmod 600 ssh_key
          ssh -o StrictHostKeyChecking=no -i ssh_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} '
            rm -rf /var/www/blog/*
          '
          rm -f ssh_key

      - name: rsync deployments
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --force
          path: dist/
          remote_path: /var/www/blog
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
